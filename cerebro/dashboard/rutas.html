<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerebro — Rutas</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#d9dce1; --text:#1d2330; --muted:#6b7280;
          --r10:#d97706; --r11:#7c3aed; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:8px 14px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; }
  main { padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #map { width:min(calc(100vw - 20px), calc(100vh - 150px)); height:auto; aspect-ratio:1;
         background:#fafafa; border:1px solid var(--line); border-radius:6px; }
  #legend { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:4px solid; border-radius:6px;
          padding:6px 12px; min-width:260px; }
  .card[data-id="10"] { border-left-color:var(--r10); } .card[data-id="11"] { border-left-color:var(--r11); }
  .card b { font-size:15px; } .card div { color:var(--muted); font-size:12px; margin-top:2px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .note { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Rutas de los rovers</h1>
  <span>Visión: <b id="vision-state" class="bad">sin datos</b></span>
</header>
<main>
  <canvas id="map" width="1000" height="1000"></canvas>
  <div id="legend"></div>
  <div class="note">Línea punteada: lo que cada rover piensa recorrer ahora. Círculo: el cubo que va a tomar. Cruz: dónde lo va a dejar.
    Solo se muestra; la ruta la decide cada rover a bordo.</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="/dashboard/rutas.js"></script>
<script>
const socket = io();
const roverStatus = {};
let world = null, lastWorld = 0;

document.getElementById('legend').innerHTML = [10, 11].map(id =>
  `<div class="card" data-id="${id}"><b>Rover ${id}</b> <span id="st-${id}" class="bad">OFFLINE</span><div id="info-${id}">sin reportes</div></div>`).join('');

function online(id) {
  const s = roverStatus[id];
  return s && Date.now() / 1000 - s.t < 3.5 ? s : null;
}

function draw() { if (world) drawRoutesMap(document.getElementById('map'), world, online); }

function legend() {
  for (const id of [10, 11]) {
    const s = online(id), st = document.getElementById(`st-${id}`), info = document.getElementById(`info-${id}`);
    st.textContent = s ? s.state : 'OFFLINE'; st.className = s ? 'ok' : 'bad';
    if (!s) continue;
    const n = (s.route || []).length;
    info.textContent = `cubo: ${TASK[s.task] || '—'} · ${n ? n + ' puntos por recorrer' : 'sin ruta ahora'} · escucha al compañero: ${s.peer ? 'sí' : 'no'}`;
  }
}

socket.on('world', w => {
  world = w; lastWorld = Date.now();
  const st = document.getElementById('vision-state');
  st.textContent = `${w.phase} · seq ${w.seq}`; st.className = 'ok';
  draw();
});
// Se sella con el reloj del navegador: el del servidor puede no coincidir
socket.on('rover_status', s => { roverStatus[s.id] = { ...s, t: Date.now() / 1000 }; });
socket.on('cerebro', c => { cerebroPlan = c.activo ? c.plan : null; });

setInterval(() => {
  legend();
  if (Date.now() - lastWorld > 1500) {
    const st = document.getElementById('vision-state');
    st.textContent = 'sin datos'; st.className = 'bad';
  }
}, 250);
</script>
</body>
</html>
